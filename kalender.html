<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalender Maret 2025</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .calendar {
      display: inline-block;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .calendar th, .calendar td {
      border: 1px solid #ccc;
      width: 50px;
      height: 50px;
      text-align: center;
      vertical-align: middle;
    }

    .calendar th {
      background-color: #007bff;
      color: white;
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .nav-button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .highlight {
      background-color: red;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <button class="nav-button">&lt;</button>
    <h2>Maret 2025</h2>
    <button class="nav-button">&gt;</button>
  </div>

  <table class="calendar">
    <tr>
      <th>Minggu</th>
      <th>Senin</th>
      <th>Selasa</th>
      <th>Rabu</th>
      <th>Kamis</th>
      <th>Jumat</th>
      <th>Sabtu</th>
    </tr>
    <tr>
      <td></td><td></td><td></td><td></td><td></td><td></td><td>1</td>
    </tr>
    <tr>
      <td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td>
    </tr>
    <tr>
      <td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td>
    </tr>
    <tr>
      <td>16</td><td>17</td><td>18</td><td>19</td><td class="highlight">20</td><td>21</td><td>22</td>
    </tr>
    <tr>
      <td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td>29</td>
    </tr>
    <tr>
      <td>30</td><td>31</td><td></td><td></td><td></td><td></td><td></td>
    </tr>
  </table>

</body>
</html>
