<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Stopwatch UI</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .canvas {
      width: 700px;
      height: 400px;
      background-color: white;
      border: 2px solid black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .time-display {
      font-family: monospace;
      font-size: 50px;
      margin-bottom: 30px;
    }

    .seconds {
      color: green;
    }

    .milliseconds {
      color: red;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .buttons button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      cursor: default;
      color: white;
    }

    .start {
      background-color: green;
    }

    .stop {
      background-color: yellow;
      color: black;
    }

    .reset {
      background-color: red;
    }
  </style>
</head>
<body>

  <div class="canvas">
    <div class="time-display">
      <span class="seconds">000</span>:<span class="milliseconds">00</span>
    </div>
    <div class="buttons">
      <button class="start">Start Timer</button>
      <button class="stop">Stop Timer</button>
      <button class="reset">Reset Timer</button>
    </div>
  </div>

</body>
</html>
